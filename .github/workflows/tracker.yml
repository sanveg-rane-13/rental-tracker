name: Rental tracker

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  schedule:
    - cron: "15 */3 * * *"    # every 3 hours at :15 UTC

permissions:
  contents: write           # lets the job commit data/*.json back to the repo

concurrency:
  group: rental-tracker     # never run two at once (they'd both edit data/)
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, compare and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py

      - name: Save seen listings
        if: always()        # save sites that worked even if another site failed
        run: |
          git config user.name "rental-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && git add data/
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update seen listings"
            git pull --rebase
            git push
          fi

      - name: Upload latest scrape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listings
          path: output/
          retention-days: 7
