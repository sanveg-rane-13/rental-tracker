name: Apartment report

on:
  workflow_dispatch:        # manual only: Actions -> Apartment report -> Run workflow
    inputs:
      max_rent:
        description: "Max rent (blank = use report.json)"
        required: false
        default: ""
      min_sqft:
        description: "Min sq ft (blank = use report.json, 0 = no minimum)"
        required: false
        default: ""
      skip_buildings:
        description: "Skip excluded buildings (listed in report.json)"
        type: boolean
        default: true

permissions:
  contents: read            # only reads data/, never changes the repo

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send report
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_RENT: ${{ inputs.max_rent }}
          MIN_SQFT: ${{ inputs.min_sqft }}
          SKIP_BUILDINGS: ${{ inputs.skip_buildings }}
        run: |
          args=""
          if [ -n "$MAX_RENT" ]; then args="$args --max-rent $MAX_RENT"; fi
          if [ -n "$MIN_SQFT" ]; then args="$args --min-sqft $MIN_SQFT"; fi
          if [ "$SKIP_BUILDINGS" = "false" ]; then args="$args --include-all"; fi
          python report.py $args

      - name: Upload report CSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report
          path: output/report.csv
          retention-days: 7
